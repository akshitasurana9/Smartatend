spring.application.name=SmartAttend
server.port=8080

# Update username/password for your local MySQL installation.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartattend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.indent-output=true
